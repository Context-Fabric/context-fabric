[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "context-fabric"
version = "0.6.0rc1"
description = "Graph-based corpus engine for annotated text with efficient traversal and search"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Cody Kingham"},
    {name = "Dirk Roorda"},
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = [
    "text",
    "linguistics",
    "annotation",
    "corpus",
    "graph",
]
dependencies = ["pyyaml>=5.3"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]
mcp = ["cfabric-mcp>=0.1.0"]
benchmarks = ["cfabric-benchmarks>=0.1.0"]
docs = [
    "griffe>=1.0",
    "griffe-typingdoc>=0.2",
]

[project.urls]
Homepage = "https://context-fabric.ai"
Documentation = "https://context-fabric.ai/docs"
Repository = "https://github.com/Context-Fabric/context-fabric"
Issues = "https://github.com/Context-Fabric/context-fabric/issues"

[tool.maturin]
features = ["python", "extension-module"]
module-name = "cfabric._core"
python-source = "."
include = [
    { path = "cfabric/py.typed", format = ["sdist", "wheel"] },
]
exclude = ["**/.cfr/**"]

[tool.cibuildwheel]
build = "cp313-*"
skip = "*-musllinux_*"
test-command = "python -c \"from cfabric import Fabric, VERSION; assert VERSION == '0.6.0rc1'; assert Fabric is not None\""

[tool.cibuildwheel.environment]
MATURIN_FEATURES = "python,extension-module"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
