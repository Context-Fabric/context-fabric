[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "context-fabric"
version = "0.6.0rc1"
description = "Graph-based corpus engine for annotated text with efficient traversal and search"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Cody Kingham"},
    {name = "Dirk Roorda"},
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = [
    "text",
    "linguistics",
    "annotation",
    "corpus",
    "graph",
]
dependencies = ["pyyaml>=5.3"]

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
dev = [
    "numpy>=1.24",
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]
mcp = ["cfabric-mcp>=0.1.0"]
benchmarks = ["cfabric-benchmarks>=0.1.0"]
docs = [
    "griffe>=1.0",
    "griffe-typingdoc>=0.2",
]

[project.urls]
Homepage = "https://context-fabric.ai"
Documentation = "https://context-fabric.ai/docs"
Repository = "https://github.com/Context-Fabric/context-fabric"
Issues = "https://github.com/Context-Fabric/context-fabric/issues"

[tool.maturin]
features = ["python", "extension-module"]
module-name = "cfabric._core"
python-source = "."
include = [
    { path = "cfabric/py.typed", format = ["sdist", "wheel"] },
]
exclude = [
    "**/.cfr/**",
    # Development notes and benchmark scripts are not part of the distribution.
    { path = "NOTES.md", format = "sdist" },
    { path = "PERFORMANCE_CUTOVER.md", format = "sdist" },
    { path = "RUST_PORT_PLAN.md", format = "sdist" },
    { path = "scripts/**", format = "sdist" },
]

[tool.cibuildwheel]
# One abi3 wheel per platform covers every CPython >= 3.13.
build = "cp313-*"
skip = "*-musllinux_*"
test-requires = ["pytest", "numpy"]
test-command = "pytest {package}/tests/python -p no:cacheprovider -q"

[tool.cibuildwheel.linux]
# manylinux containers ship without Rust.
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos]
# Built on an arm64 runner; maturin cross-compiles x86_64 from ARCHFLAGS.
archs = ["arm64", "x86_64"]
before-all = "rustup target add aarch64-apple-darwin x86_64-apple-darwin"
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
