[package]
name = "context_fabric_core"
version = "0.6.0-rc.1"
edition = "2024"
description = "Rust core engine and Python extension for Context-Fabric"
license = "MIT"
repository = "https://github.com/Context-Fabric/context-fabric"
homepage = "https://context-fabric.ai"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3", "dep:pyo3-stub-gen", "dep:numpy"]
extension-module = ["pyo3/extension-module"]

[dependencies]
memmap2 = "0.9.10"
mimalloc = { version = "0.1", default-features = false }
numpy = { version = "0.25", optional = true }
pyo3 = { version = "0.25", optional = true, features = ["abi3-py313"] }
pyo3-stub-gen = { version = "0.13", optional = true }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.23"
