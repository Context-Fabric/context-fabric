[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfabric-browser"
version = "0.1.0"
description = "Graphical browser for Context-Fabric corpora: search, read and compare, offline"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # only its public API: the Python core (0.5) or the Rust one (0.6)
    "context-fabric>=0.5.7",
    # the tools a language model gets (searching in plain language) share
    # cfabric-mcp's; needs its `tools.using`, unreleased
    "cfabric-mcp>=0.1.7",
    "fastapi>=0.115",
    "uvicorn>=0.32.0",
    # app configurations, display overrides, browser.yaml; the Rust core
    # doesn't bring it along, as the Python one did
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://context-fabric.ai"
Repository = "https://github.com/Context-Fabric/context-fabric"
Issues = "https://github.com/Context-Fabric/context-fabric/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx2>=2.0",
]
# building the standalone program (packaging/cfabric-browser.spec)
desktop = [
    "pyinstaller>=6.10",
    "pywebview>=5.0",
    # certificates for downloading translations (macOS has none for Python)
    "certifi",
]

[project.scripts]
cfabric-browser = "cfabric_browser.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cfabric_browser*"]

[tool.setuptools.package-data]
cfabric_browser = ["static/**/*", "translations/*.json", "dictionaries/*.yaml", "assistant/guides/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
