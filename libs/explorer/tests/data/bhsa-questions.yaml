# Requests for testing how well a model turns plain language into a
# BHSA search template: each with a correct template and its count in
# the BHSA 2021. Not the guide's examples (assistant/guides/bhsa.md).
# tests/test_assistant_questions.py checks the counts when the BHSA is
# on this computer. Drafted 2026-10-16; to be corrected and added to by
# the user.
- level: easy
  request: Where does the word for king, MLK/, occur?
  template: word lex=MLK/
  count: 2703
- level: easy
  request: Find every form of the verb 'to say', >MR[.
  template: word lex=>MR[
  count: 5378
- level: easy
  request: All the occurrences of the Tetragrammaton in Genesis
  template: |-
    book book=Genesis
