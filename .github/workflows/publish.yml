name: Publish to PyPI

on:
  push:
    tags:
      - 'core-v*'
      - 'mcp-v*'
      - 'benchmarks-v*'

jobs:
  core-distributions:
    name: Build and test context-fabric distributions
    if: startsWith(github.ref, 'refs/tags/core-v')
    uses: ./.github/workflows/core-wheels.yml

  publish-core:
    name: Publish context-fabric
    if: startsWith(github.ref, 'refs/tags/core-v')
    needs: core-distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check that the tag matches the package version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("libs/core/pyproject.toml", "rb"))["project"]["version"])')"
          if [ "core-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match context-fabric version $version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: core-dist-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pip install twine
          twine check dist/*
          twine upload --skip-existing dist/*

  publish-mcp:
    name: Publish cfabric-mcp
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install build maturin twine
          PYO3_PYTHON="$(python -c 'import sys; print(sys.executable)')" pip install -e ../core
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*

  publish-benchmarks:
    name: Publish cfabric-benchmarks
    if: startsWith(github.ref, 'refs/tags/benchmarks-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/benchmarks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install build maturin twine
          PYO3_PYTHON="$(python -c 'import sys; print(sys.executable)')" pip install -e ../core
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*
