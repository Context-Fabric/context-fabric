name: Publish to PyPI

on:
  push:
    tags:
      - 'core-v*'
      - 'mcp-v*'
      - 'benchmarks-v*'
      - 'browser-v*'

jobs:
  publish-core:
    name: Publish context-fabric
    if: startsWith(github.ref, 'refs/tags/core-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install build twine
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*

  publish-mcp:
    name: Publish cfabric-mcp
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install build twine
          pip install -e ../core
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*

  publish-benchmarks:
    name: Publish cfabric-benchmarks
    if: startsWith(github.ref, 'refs/tags/benchmarks-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/benchmarks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install build twine
          pip install -e ../core
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/
      - name: Build package
        run: python -m build
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*

  publish-browser:
    name: Publish cfabric-browser
    if: startsWith(github.ref, 'refs/tags/browser-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the interface into the package
        working-directory: libs/browser/frontend
        run: |
          npm ci
          npm run build
      - name: Install dependencies
        run: |
          pip install build twine
          pip install -e ../core
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/
      - name: Build package
        run: python -m build
      - name: Check that the interface is in the wheel
        run: python -c "import zipfile, glob; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'cfabric_browser/static/index.html' in names, 'interface missing from wheel'"
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --skip-existing dist/*
