name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-core:
    name: Test context-fabric
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          pip install -e ".[dev]"
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Run Rust tests
        env:
          PYO3_PYTHON: ${{ github.workspace }}/libs/core/.venv/bin/python
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin
          PYO3_PYTHON="$PWD/.venv/bin/python" cargo test --features python
      - name: Build editable extension
        run: |
          PYO3_PYTHON="$(python -c 'import sys; print(sys.executable)')" maturin develop
      - name: Run Python tests
        run: pytest tests/python -v

  test-mcp:
    name: Test cfabric-mcp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install core package
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          PYO3_PYTHON="$(python -c 'import sys; print(sys.executable)')" pip install -e ../core
      - name: Install MCP package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v

  test-benchmarks:
    name: Test cfabric-benchmarks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/benchmarks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install core package
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          PYO3_PYTHON="$(python -c 'import sys; print(sys.executable)')" pip install -e ../core
      - name: Install benchmarks package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v
