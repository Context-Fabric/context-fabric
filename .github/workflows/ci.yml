name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test-core:
    name: Test context-fabric
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v

  test-mcp:
    name: Test cfabric-mcp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install core package
        run: pip install -e ../core
      - name: Install MCP package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v

  test-benchmarks:
    name: Test cfabric-benchmarks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/benchmarks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install core package
        run: pip install -e ../core
      - name: Install benchmarks package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v

  test-browser:
    # with the Python core of this repository, and with the Rust core (0.6)
    # from PyPI: the browser uses only the public API of either
    name: Test cfabric-browser (${{ matrix.core }} core)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: [python, rust]
    defaults:
      run:
        working-directory: libs/explorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: libs/explorer/frontend/package-lock.json
      - name: Type-check, test and build the interface
        working-directory: libs/explorer/frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Install the core, and the MCP package (the browser shares its tools)
        run: |
          if [ "${{ matrix.core }}" = rust ]; then
            pip install "context-fabric==0.6.0rc1"
          else
            pip install -e ../core
          fi
          pip install -e ../mcp
      - name: Install browser package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: |
          python -c "import cfabric, importlib.metadata as m; print('context-fabric', m.version('context-fabric'))"
          pytest tests/ -v

  install-browser:
    # the package as publish.yml builds it (with the interface), installed in a
    # fresh environment with nothing from this repository: its dependencies come
    # from PyPI, with the Python core (0.5) or the Rust one (0.6.0rc1); then the
    # program is started and searched by packaging/smoke-test.sh
    name: Install cfabric-browser (${{ matrix.os }}, core ${{ matrix.core }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        core: ['0.5', '0.6.0rc1']
    defaults:
      run:
        shell: bash
        working-directory: libs/explorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: libs/explorer/frontend/package-lock.json
      - name: Build the interface
        working-directory: libs/explorer/frontend
        run: |
          npm ci
          npm run build
      - name: Build the package
        run: |
          pip install build
          python -m build
          python - <<'PY'
          import glob, tarfile, zipfile
          wheel = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          sdist = tarfile.open(glob.glob("dist/*.tar.gz")[0]).getnames()
          for name in ("static/index.html", "static/guide/index.html"):
              assert "cfabric_browser/" + name in wheel, f"{name} not in the wheel"
              assert any(n.endswith("cfabric_browser/" + name) for n in sdist), f"{name} not in the sdist"
          print("wheel and sdist carry the interface and the guide")
          PY
      - name: Install it in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          bin="$RUNNER_TEMP/venv/bin"; [ -d "$bin" ] || bin="$RUNNER_TEMP/venv/Scripts"
          echo "BIN=$bin" >> "$GITHUB_ENV"
          if [ "${{ matrix.core }}" = 0.5 ]; then core="context-fabric<0.6"; else core="context-fabric==${{ matrix.core }}"; fi
          "$bin/python" -m pip install "$(ls dist/*.whl)[window]" "$core"
          cd "$RUNNER_TEMP"
          "$bin/python" -c "import importlib.metadata as m, cfabric_browser; print(*(f'{p} {m.version(p)}' for p in ('cfabric-browser', 'context-fabric', 'cfabric-mcp')), cfabric_browser.__file__, sep='\n')"
      - name: Start it and search
        run: bash packaging/smoke-test.sh "$BIN/caccht-explorer" tests/fixtures/display_corpus
