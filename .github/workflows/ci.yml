name: CI

on:
  push:
    branches: [master, main, cf-rust]
  pull_request:
    branches: [master, main, cf-rust]

jobs:
  test-core:
    name: Test context-fabric
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          pip install -e ".[dev]"
          echo "PYO3_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Clippy (every warning is an error)
        run: cargo clippy --all-targets --features python -- -D warnings
      - name: Run Rust tests
        run: cargo test --features python
      - name: Run Python tests
        run: pytest tests/python -v

  distributions:
    name: Build and test context-fabric distributions
    uses: ./.github/workflows/core-wheels.yml

  test-mcp:
    name: Test cfabric-mcp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install core package
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          PYO3_PYTHON="$(python -c 'import sys; print(sys.executable)')" pip install -e ../core
      - name: Install MCP package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v

  test-benchmarks:
    name: Test cfabric-benchmarks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/benchmarks
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install core package
        run: |
          python -m pip install --upgrade pip
          pip install maturin
          PYO3_PYTHON="$(python -c 'import sys; print(sys.executable)')" pip install -e ../core
      - name: Install benchmarks package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v
