name: Generate API Docs

on:
  push:
    branches: [master, main]
    paths:
      - 'libs/**/*.py'
      - 'scripts/docs/**'
      - 'griffe.toml'
  workflow_dispatch:

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install griffe griffe-typingdoc
          pip install -e libs/core
          pip install -e libs/mcp
          pip install -e libs/benchmarks

      - name: Generate documentation
        run: python scripts/docs/generate_docs.py

      # master only takes changes through pull requests (ruleset `default`),
      # so the regenerated docs go into a pull request on a fixed branch.
      # Later runs update that branch and its open pull request.
      - name: Open a pull request with the updated docs
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: docs/api/
          branch: auto/api-docs
          delete-branch: true
          commit-message: "docs: auto-generate API documentation"
          title: "docs: auto-generate API documentation"
          body: |
            The API documentation in `docs/api/`, regenerated by the
            *Generate API Docs* workflow after the push of ${{ github.sha }}.
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
