name: Browser desktop program

# Builds cfabric-browser as a standalone program (PyInstaller, pywebview) on
# Windows, macOS and Linux, smoke-tests each build, and tests the Windows build
# once more on a runner where Python is out of reach. A tag desktop-v* (such as
# desktop-v0.1.0-test.1) also publishes the builds as a GitHub pre-release, with
# libs/browser/packaging/RELEASE_NOTES.md as its text. Not browser-v*: that tag
# publishes the package on PyPI (publish.yml).

on:
  push:
    branches: [master, main, 'browser-*', 'desktop-*']
    tags: ['desktop-v*']
    paths:
      - 'libs/browser/**'
      - 'libs/core/cfabric/**'
      - '.github/workflows/browser-desktop.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'libs/browser/**'
      - 'libs/core/cfabric/**'
      - '.github/workflows/browser-desktop.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: macos-x64, os: macos-15-intel }
          - { name: linux, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: libs/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: libs/browser/frontend/package-lock.json
      - name: Build the interface
        working-directory: libs/browser/frontend
        run: |
          npm ci
          npm run build
      - name: Install (not editable, PyInstaller does not see editable installs)
        run: pip install ../core ".[desktop]"
      - name: Build the program
        run: pyinstaller packaging/cfabric-browser.spec --noconfirm
      - name: Smoke test
        run: |
          program=dist/cfabric-browser/cfabric-browser
          [ -f "$program.exe" ] && program=$program.exe
          bash packaging/smoke-test.sh "$program" ../core/tests/fixtures/display_corpus
      - name: Size
        run: du -sh dist/*
      - name: Pack (keeps file permissions)
        run: |
          mkdir -p ../../out
          case "${{ matrix.name }}" in
            windows) 7z a -tzip ../../out/cfabric-browser-windows.zip ./dist/cfabric-browser > /dev/null ;;
            macos-*) ditto -c -k --keepParent dist/Context-Fabric.app ../../out/Context-Fabric-${{ matrix.name }}.zip ;;
            linux) tar -czf ../../out/cfabric-browser-linux.tar.gz -C dist cfabric-browser ;;
          esac
          ls -l ../../out
      - uses: actions/upload-artifact@v4
        with:
          name: cfabric-browser-${{ matrix.name }}
          path: out/*
          retention-days: 14

  clean-windows:
    name: Run on Windows without Python
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            libs/browser/packaging
            libs/core/tests/fixtures
      - uses: actions/download-artifact@v4
        with:
          name: cfabric-browser-windows
      - name: Unpack
        run: 7z x cfabric-browser-windows.zip -oprogram > /dev/null
      - name: Smoke test with Python out of reach
        run: |
          # take every folder with a Python off the path (the py launcher lives
          # in C:\Windows), until none is left
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -viE "python|windowsapps" | paste -sd: -)
          for name in python python3 py; do
            tries=0
            while found=$(command -v "$name") && [ $((tries += 1)) -le 10 ]; do
              echo "taking $(dirname "$found") off the path ($found)"
              export PATH=$(echo "$PATH" | tr ':' '\n' | grep -vixF "$(dirname "$found")" | paste -sd: -)
            done
          done
          if command -v python python3 py; then
            echo "::error title=Clean Windows::a Python is still reachable"; exit 1
          fi
          bash libs/browser/packaging/smoke-test.sh \
            program/cfabric-browser/cfabric-browser.exe \
            libs/core/tests/fixtures/display_corpus

  release:
    name: Publish a pre-release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [build, clean-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: libs/browser/packaging/RELEASE_NOTES.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: ls -l out
      # desktop-v0.1.0-test.2 is released as "Context-Fabric 0.1.0-test.2"
      - id: version
        run: echo "version=${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: Context-Fabric ${{ steps.version.outputs.version }}
          body_path: libs/browser/packaging/RELEASE_NOTES.md
          prerelease: true
          files: out/*
